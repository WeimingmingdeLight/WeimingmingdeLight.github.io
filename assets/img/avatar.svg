<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Aphelion 标识：一颗行星运行到远日点">
  <defs>
    <radialGradient id="apSky" cx="46%" cy="38%" r="68%">
      <stop offset="0" stop-color="#3f5a74"/>
      <stop offset="0.55" stop-color="#28394d"/>
      <stop offset="1" stop-color="#161f2b"/>
    </radialGradient>
    <linearGradient id="apOrbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#45b8e8" stop-opacity="0.25"/>
      <stop offset="0.45" stop-color="#45b8e8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e8b4c8" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="apSun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff2cf"/>
      <stop offset="1" stop-color="#f0c46a"/>
    </radialGradient>
    <radialGradient id="apPlanet" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c9d8"/>
    </radialGradient>
    <clipPath id="apClip">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
  </defs>

  <g clip-path="url(#apClip)">
    <circle cx="256" cy="256" r="256" fill="url(#apSky)"/>

    <!-- 背景星点 -->
    <g fill="#ffffff" opacity="0.55">
      <circle cx="96" cy="112" r="2.4"/>
      <circle cx="164" cy="70" r="1.6"/>
      <circle cx="404" cy="104" r="2"/>
      <circle cx="452" cy="188" r="1.5"/>
      <circle cx="72" cy="268" r="1.8"/>
      <circle cx="132" cy="404" r="2.2"/>
      <circle cx="330" cy="440" r="1.7"/>
      <circle cx="426" cy="368" r="2.4"/>
      <circle cx="238" cy="60" r="1.4"/>
      <circle cx="356" cy="300" r="1.5"/>
    </g>

    <!-- 轨道与天体：整体旋转，使远日点落在右上 -->
    <g transform="rotate(-30 256 256)">
      <ellipse cx="256" cy="256" rx="150" ry="104" fill="none"
               stroke="url(#apOrbit)" stroke-width="5"/>
      <ellipse cx="256" cy="256" rx="150" ry="104" fill="none"
               stroke="#ffffff" stroke-opacity="0.08" stroke-width="13"/>

      <!-- 恒星位于椭圆焦点 -->
      <circle cx="156" cy="256" r="34" fill="#f0c46a" opacity="0.16"/>
      <circle cx="156" cy="256" r="18" fill="url(#apSun)"/>

      <!-- 行星位于远日点（离恒星最远的一端） -->
      <circle cx="406" cy="256" r="13" fill="url(#apPlanet)"/>
      <circle cx="406" cy="256" r="26" fill="none" stroke="#ffffff"
              stroke-opacity="0.22" stroke-width="1.6"/>
    </g>

    <!-- 内圈装饰 -->
    <circle cx="256" cy="256" r="228" fill="none" stroke="#ffffff"
            stroke-opacity="0.1" stroke-width="1.5"/>
  </g>
</svg>
